<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 110" width="90" height="110">

  <defs>
    <linearGradient id="blank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#16212b"/>
      <stop offset="0.35" stop-color="#46606f"/>
      <stop offset="0.60" stop-color="#9db6c4"/>
      <stop offset="1"    stop-color="#1b2831"/>
    </linearGradient>

    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8a5f34"/>
      <stop offset="0.40" stop-color="#d9ae78"/>
      <stop offset="1"    stop-color="#7d5530"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#6b7681"/>
      <stop offset="0.45" stop-color="#e6eef4"/>
      <stop offset="1"    stop-color="#5c666f"/>
    </linearGradient>

    <linearGradient id="reelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e34b4b"/>
      <stop offset="1" stop-color="#8c1f1f"/>
    </linearGradient>
  </defs>

  <!-- ظل خفيف -->
  <g opacity="0.35">
    <rect x="35" y="4" width="22" height="30" rx="10" fill="#000"/>
    <polygon points="41.5,36 50.5,36 47.2,101 44.8,101" fill="#000"/>
  </g>

  <!-- المقبض (فلين) -->
  <rect x="33" y="2" width="22" height="32" rx="10" fill="url(#cork)"/>
  <rect x="33" y="2" width="22" height="32" rx="10" fill="none" stroke="#4a3116" stroke-width="1.4"/>

  <!-- حلقات المقبض -->
  <rect x="33" y="9"  width="22" height="4" fill="#22262b" opacity="0.75"/>
  <rect x="33" y="24" width="22" height="4" fill="#22262b" opacity="0.75"/>

  <!-- طوق معدني -->
  <rect x="32" y="33" width="24" height="7" rx="3" fill="url(#metal)" stroke="#3b444c" stroke-width="1.2"/>

  <!-- ذراع المكينة -->
  <path d="M56 40 L66 46" stroke="#3b444c" stroke-width="4" stroke-linecap="round"/>

  <!-- المكينة (البكرة) -->
  <circle cx="70" cy="48" r="10.5" fill="url(#reelG)" stroke="#5a1414" stroke-width="1.6"/>
  <circle cx="70" cy="48" r="5"    fill="#f1f4f7" stroke="#7d8a93" stroke-width="1.2"/>
  <circle cx="70" cy="48" r="1.8"  fill="#3b444c"/>
  <path d="M70 48 L79 53" stroke="#3b444c" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="80" cy="54" r="3" fill="#d9ae78" stroke="#4a3116" stroke-width="1"/>

  <!-- عصا الصنارة -->
  <polygon points="41,36 50,36 46.6,101 45.4,101"
           fill="url(#blank)" stroke="#0f1820" stroke-width="1"/>

  <!-- لمعة -->
  <polygon points="44.2,38 45.6,38 46.1,99 45.7,99" fill="#ffffff" opacity="0.35"/>

  <!-- حلقات التوجيه -->
  <ellipse cx="46.6" cy="55" rx="6.5" ry="2.6" fill="none" stroke="#cfd9e0" stroke-width="1.6"/>
  <ellipse cx="46.3" cy="71" rx="5.2" ry="2.2" fill="none" stroke="#cfd9e0" stroke-width="1.5"/>
  <ellipse cx="46.1" cy="85" rx="4.2" ry="1.9" fill="none" stroke="#cfd9e0" stroke-width="1.4"/>
  <ellipse cx="46.0" cy="95" rx="3.4" ry="1.6" fill="none" stroke="#cfd9e0" stroke-width="1.3"/>

  <!-- طرف الصنارة -->
  <circle cx="46" cy="101" r="2.4" fill="#f1f4f7" stroke="#3b444c" stroke-width="1"/>

</svg>