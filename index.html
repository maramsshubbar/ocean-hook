<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fishing Adventure</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- START SCREEN -->

  <div id="start-screen" class="start-screen">

    <div class="menu-content">

      <h1>Fishing Adventure</h1>

      <p>Catch the fish!</p>

      <button id="start-btn">
        Start Game
      </button>

    </div>

  </div>


  <!-- GAME SCREEN -->

  <div id="game-screen" class="game-screen">

    <!-- GAME INFO -->

    <div class="game-info">

      <div class="info-box">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>

      <div class="info-box">
        <span>Fish Caught</span>
        <strong id="fish-caught">0</strong>
      </div>

      <div class="info-box">
        <span>Time</span>
        <strong id="timer">60</strong>
      </div>

    </div>


    <!-- FISH AREA -->

    <div id="game-area" class="game-area"></div>


    <!-- GAME OVER -->

    <div id="game-over" class="game-over">

      <h2>Game Over!</h2>

      <p>Your Score</p>

      <strong id="final-score">0</strong>

      <p>
        Fish Caught:
        <span id="final-fish">0</span>
      </p>

      <button id="restart-btn">
        Play Again
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
